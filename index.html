<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />

    <!-- PWA / iOS Capabilities -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LunaFlow" />

    <title>LunaFlow Tracker</title>

    <!-- 
      iOS ICONS
      Path points to res/ folder. Ensure the file 'apple-touch-icon.png' is inside the 'res' folder.
    -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="res/apple-touch-icon.png"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- 
      FAVICONS
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg width='64' height='64' viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='32' y1='0' x2='32' y2='64' gradientUnits='userSpaceOnUse'%3E%3Cstop stop-color='%23f43f5e'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M32 2 C32 2 10 30 10 42 C10 54 20 62 32 62 C44 62 54 54 54 42 C54 30 32 2 32 2Z' fill='url(%23g)'/%3E%3Cpath d='M32 12 C32 12 22 34 22 42 C22 47 26 52 32 52 C38 52 42 47 42 42 C42 34 32 12 32 12Z' fill='white' fill-opacity='0.2'/%3E%3Cellipse cx='26' cy='36' rx='2' ry='5' transform='rotate(-20 26 36)' fill='white' fill-opacity='0.5'/%3E%3C/svg%3E"
    />
    <link rel="icon" type="image/png" sizes="192x192" href="res/icon-192.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      /* Hide scrollbar for clean UI */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* Prevent elastic scrolling on iOS to feel more native */
      html,
      body {
        height: 100%;
        height: 100dvh;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 overflow-hidden">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
